# codecongruence — semantic pre-commit hook config.
# This file is consumed by codecongruence at the repo root.

[codecongruence]
model = "BAAI/bge-small-en-v1.5"
parallel = true
# Global file/folder excludes — applied to every rule.
# exclude = ["tests/**", "docs/**", "**/*.pyi"]
# Global function excludes — fnmatch on qualified_name (e.g. "ClassName.method").
# exclude_functions = ["setup", "main", "MyClass.*"]

[rules.docstring_vs_body]
enabled = true
threshold = 0.30
min_body_statement_count = 3
min_docstring_chars = 10
# Per-rule file excludes (added on top of global exclude).
exclude = ["tests/**", "**/__init__.py"]
# Per-rule function excludes (added on top of global exclude_functions).
# exclude_functions = ["LegacyClass.*"]

[rules.name_vs_body]
enabled = true
threshold = 0.25
min_body_statement_count = 2
ignore_names = ["main", "run", "setup", "handle", "process", "execute"]

[rules.param_name_vs_usage]
enabled = true
threshold = 0.20
min_body_statement_count = 2
min_param_name_chars = 2

[rules.params_in_docstring]
enabled = true
skip_variadic = true
exclude = ["tests/**"]
exclude_functions = ["main"]

[rules.claude_md_vs_diff]
enabled = true
threshold = 0.20
code_paths = ["src/**"]
docs_files = ["CLAUDE.md"]

[rules.pr_description_vs_diff]
enabled = false
threshold = 0.25

[rules.stale_comments]
enabled = true
threshold = 0.20
context_lines = 5

[rules.docs_on_change]
enabled = true
threshold = 0.20
trigger_paths = ["src/**"]
docs_files = ["CHANGELOG.md", "README.md"]
