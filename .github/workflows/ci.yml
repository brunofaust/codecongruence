name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + typecheck + tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so codecongruence can read git diff

      - name: install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: set up python
        run: uv python install ${{ matrix.python-version }}

      - name: sync deps
        run: uv sync --extra dev

      - name: ruff (lint)
        run: uv run ruff check src tests

      - name: ruff (format check)
        run: uv run ruff format --check src tests

      - name: mypy
        run: uv run mypy

      - name: pytest
        run: uv run pytest -ra --strict-markers --strict-config

  dogfood:
    name: codecongruence on itself
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv python install 3.13

      - run: uv sync --extra dev

      - name: run codecongruence on the diff vs main
        env:
          CODECONGRUENCE_PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # On main: scan the whole repo. On a PR: scan everything changed vs
          # the base ref.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }} --depth=1
            CHANGED=$(git diff --name-only --diff-filter=ACMR \
                       origin/${{ github.base_ref }}...HEAD)
            if [ -n "$CHANGED" ]; then
              # Stage the changed paths so codecongruence sees them in the
              # staged diff. (CI runners have nothing else staged.)
              echo "$CHANGED" | xargs -r git add --
            fi
          fi
          uv run codecongruence --all --format json | tee codecongruence.json
